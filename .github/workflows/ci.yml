name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both Ubuntu's fork path and Windows' spawn path must pass, and
        # the file-locking shim has a different backend on each platform.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show the environment
        run: python -VV

      # No `pip install` step anywhere in this file. That is the point.
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  zero-deps:
    name: zero-dependency proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert nothing outside the standard library is imported
        run: python tools/check_deps.py

      - name: Fail if deps-proof.txt is stale
        run: |
          python tools/check_deps.py > /tmp/deps-proof.txt
          # The header line records the interpreter and platform, which differ
          # per runner; compare only the substantive part.
          diff <(tail -n +4 deps-proof.txt | tr -d '\r') <(tail -n +4 /tmp/deps-proof.txt) \
            || { echo "::error::deps-proof.txt is out of date - run 'make deps-proof'"; exit 1; }

  package:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check the metadata
        run: python -m twine check dist/*

      - name: Assert the wheel declares no dependencies
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              meta = next(n for n in zf.namelist() if n.endswith("METADATA"))
              text = zf.read(meta).decode()
          requires = [l for l in text.splitlines() if l.startswith("Requires-Dist:")]
          if requires:
              print("wheel declares dependencies:", *requires, sep="\n  ")
              sys.exit(1)
          print("wheel declares 0 dependencies")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
